name: TITAN independent panel third-generation retirement
on:
  push:
    branches: [codex/titan-independent-retirement]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: titan-independent-remote-publication
  cancel-in-progress: false
jobs:
  prerequisite:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_titan_panel_retention.py
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_titan_retirement_prerequisite.py
  retire:
    needs: prerequisite
    if: needs.prerequisite.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: titan-panel-runtime-lock
          run-id: '45759575549'
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - run: python -m pip install -r panel-runtime-lock.txt && python -m pip install "requests>=2.32,<3"
      - name: Journal and Trash exactly one obsolete independent chart pack
        env:
          WAWP_RCLONE_CONFIG: ${{ secrets.WAWP_ARCHIVE_RCLONE_CONFIG }}
          WAWP_ARCHIVE_FOLDER_ID: ${{ vars.WAWP_ARCHIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$WAWP_RCLONE_CONFIG" && test -n "$WAWP_ARCHIVE_FOLDER_ID"
          umask 077
          export RCLONE_CONFIG="$RUNNER_TEMP/titan-retire.conf"
          export RCLONE_CONFIG_WAWP_ROOT_FOLDER_ID="$WAWP_ARCHIVE_FOLDER_ID"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s\n' "$WAWP_RCLONE_CONFIG" > "$RCLONE_CONFIG"
          unset WAWP_RCLONE_CONFIG
          PYTHONPATH=. python scripts/titan_independent_retirement.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-independent-retirement-report
          path: independent-retirement-report.json
          retention-days: 30
