name: TITAN shared ECMWF acquisition pilot
on:
  push:
    branches: [codex/titan-shared-acquisition-pilot]
    paths: ['scripts/shared_spatial_fetch.py','scripts/pilot_shared_acquisition.py','scripts/test_shared_spatial_fetch.py','.github/workflows/titan_shared_acquisition_pilot.yml']
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: titan-spatial-review-v3-offline
          run-id: '45625176987'
          github-token: ${{ github.token }}
          path: review-inputs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_shared_spatial_fetch.py
      - run: python -m pip install "eccodes>=2.42,<3" "numpy>=2,<3" "matplotlib>=3.9,<4" "basemap>=2,<3" "metpy>=1.7,<2" scipy
      - run: python scripts/pilot_shared_acquisition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-shared-acquisition-metrics
          path: shared-acquisition-pilot/*.json
          retention-days: 7
          if-no-files-found: warn
