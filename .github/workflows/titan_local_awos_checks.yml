name: TITAN private live AWOS checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/titan_local_awos_checks.yml'
      - 'scripts/serve_titan_live_awos.py'
      - 'scripts/normalize_awosnet_xml.py'
      - 'tests/test_serve_titan_live_awos.py'
      - 'tests/test_normalize_awosnet_xml.py'
      - 'docs/observation-ui.js'
      - 'tests/test_observation_ui.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m unittest discover -s tests -p test_normalize_awosnet_xml.py
          python -m unittest discover -s tests -p test_serve_titan_live_awos.py
          node --check docs/observation-ui.js
          node tests/test_observation_ui.js
