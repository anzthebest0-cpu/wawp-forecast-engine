name: TITAN lossless spatial cache rehearsal
on:
  push:
    branches: [codex/titan-spatial-cache-pilot]
    paths: ['scripts/rehearse_spatial_cache.py','.github/workflows/titan_spatial_cache_pilot.yml']
permissions:
  contents: read
  actions: read
jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: titan-spatial-review-v3-offline
          run-id: '45625176987'
          github-token: ${{ github.token }}
          path: review-inputs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python -m py_compile scripts/rehearse_spatial_cache.py
      - run: python scripts/rehearse_spatial_cache.py
      - uses: actions/upload-artifact@v4
        with:
          name: titan-spatial-cache-lossless-preview
          path: spatial-cache-rehearsal/
          retention-days: 7
