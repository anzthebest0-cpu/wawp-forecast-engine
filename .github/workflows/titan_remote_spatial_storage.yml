name: TITAN targeted spatial chart retirement recovery
on:
  push:
    branches: [codex/titan-remote-spatial-storage]
permissions:
  contents: read
  actions: read
concurrency:
  group: titan-remote-spatial-validation
  cancel-in-progress: false
jobs:
  spatial:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - run: python -m pip install "numpy>=2,<3" pillow "requests>=2.32,<3"
      - name: Recover exact obsolete chart with verified intent and receipt
        env:
          WAWP_RCLONE_CONFIG: ${{ secrets.WAWP_ARCHIVE_RCLONE_CONFIG }}
          WAWP_ARCHIVE_FOLDER_ID: ${{ vars.WAWP_ARCHIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$WAWP_RCLONE_CONFIG" && test -n "$WAWP_ARCHIVE_FOLDER_ID"
          umask 077
          export RCLONE_CONFIG="$RUNNER_TEMP/titan-spatial-fixture.conf"
          export RCLONE_CONFIG_WAWP_ROOT_FOLDER_ID="$WAWP_ARCHIVE_FOLDER_ID"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s\n' "$WAWP_RCLONE_CONFIG" > "$RCLONE_CONFIG"
          unset WAWP_RCLONE_CONFIG
          PYTHONPATH=. python scripts/recover_titan_spatial_chart_retirement.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-remote-spatial-retirement-report
          path: remote-spatial-retirement-report.json
          retention-days: 30
          if-no-files-found: warn
