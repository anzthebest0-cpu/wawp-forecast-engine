name: Build WAWP Wind Watch APK

on:
  push:
    branches: [ "wawp-wind-watch" ]
    paths:
      - 'android/wawp-wind-watch/**'
      - '.github/workflows/build-wawp-wind-watch.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/wawp-wind-watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: wawp-wind-watch-debug-apk
          path: android/wawp-wind-watch/app/build/outputs/apk/debug/app-debug.apk
