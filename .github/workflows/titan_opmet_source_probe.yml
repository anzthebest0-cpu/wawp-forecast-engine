name: TITAN one-time OPMET source investigation
on:
  push:
    branches: [codex/titan-opmet-source-probe]
    paths: ['tests/probe_opmet_sources.cjs', '.github/workflows/titan_opmet_source_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Inspect public source delivery and report coverage
        run: node tests/probe_opmet_sources.cjs
