name: WAWP Historical Archive Validation

on:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wawp-historical-archive-validation
  cancel-in-progress: false

jobs:
  historical-roundtrip:
    if: >-
      github.event.pull_request.number == 4 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'storage-migration-lossless' &&
      github.event.label.name == 'archive-validation-test'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and run storage tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone zstd unzip
          python -m pip install -r requirements.txt
          PYTHONPATH=. python -m pytest -q tests/test_storage_incremental_archive.py tests/test_storage_migration.py
      - name: Recover pinned baseline and run isolated Drive recovery exercise
        env:
          WAWP_RCLONE_CONFIG: ${{ secrets.WAWP_ARCHIVE_RCLONE_CONFIG }}
          WAWP_ARCHIVE_FOLDER_ID: ${{ vars.WAWP_ARCHIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$WAWP_RCLONE_CONFIG" && test -n "$WAWP_ARCHIVE_FOLDER_ID"
          umask 077
          export RCLONE_CONFIG="$RUNNER_TEMP/wawp-validation.conf"
          export RCLONE_CONFIG_WAWP_ROOT_FOLDER_ID="$WAWP_ARCHIVE_FOLDER_ID"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s\n' "$WAWP_RCLONE_CONFIG" > "$RCLONE_CONFIG"
          unset WAWP_RCLONE_CONFIG
          work="$RUNNER_TEMP/wawp-validation"
          mkdir -p "$work/source" "$work/parts" artifacts/storage-validation
          for part in 00 01 02; do
            name="WAWP_Baseline_2026-09-15_verified.zip.part$part"
            rclone copyto --immutable --checksum "wawp:$name" "$work/parts/$name"
          done
          cat "$work/parts/"*.part00 "$work/parts/"*.part01 "$work/parts/"*.part02 > "$work/baseline.zip"
          printf '%s  %s\n' '4db827147a685794de287df3bd3b41b9d2c89bcc36eb00305db70ac4f790f54e' "$work/baseline.zip" | sha256sum -c
          unzip -q "$work/baseline.zip" -d "$work/source"
          python -m src.storage_snapshot restore "$work/source/migration-verified.db.zst" "$work/baseline.db"
          printf '%s  %s\n' 'abcf50f0c254bc93ffed010b1ccc2415cd4e079d651f99ebed8418b93ce2a6ea' "$work/baseline.db" | sha256sum -c
          echo 'PASS: independently recovered original verified baseline from Drive'
          PYTHONPATH=. python scripts/validate_remote_archive.py \
            --source "$work/baseline.db" --work "$work/exercise" \
            --remote "wawp:validation/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --report artifacts/storage-validation/recovery.json
      - name: Frozen-clock scientific product replay
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/wawp-validation"
          status=0
          PYTHONPATH=. python tests/replay_storage_equivalence.py \
            "$work/baseline.db" "$work/exercise/operational-recovered.db" "$work/replay" \
            --timestamp 2026-09-15T17:16:35+00:00 || status=$?
          if test -f "$work/replay/report.json"; then
            cp "$work/replay/report.json" artifacts/storage-validation/replay.json
          fi
          exit "$status"
      - name: Publish validation metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-validation-${{ github.run_id }}
          path: artifacts/storage-validation/*.json
          retention-days: 30
          if-no-files-found: warn
