name: WAWP Meteologix Engine

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '30 0 * * *'  # 00:30 UTC -> 08:30 WITA
    - cron: '30 6 * * *'  # 06:30 UTC -> 14:30 WITA
    - cron: '30 12 * * *' # 12:30 UTC -> 20:30 WITA
    - cron: '30 18 * * *' # 18:30 UTC -> 02:30 WITA
  workflow_dispatch:
    inputs:
      compact_db_audit:
        description: 'Upload the compact-database validation report for this run'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

# The rolling release asset is a shared mutable archive. Never let two runners
# download the same copy and race to replace it.
concurrency:
  group: wawp-engine-production
  cancel-in-progress: false

jobs:
  run-pipeline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          # Use apt-get for linux dependencies (Chrome for Selenium)
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable zstd
          pip install -r requirements.txt

      - name: Download Database from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view latest-db > /dev/null 2>&1; then
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest-db" --jq .id)"
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" | jq -s '.' > release-assets.json
            asset_name="$(python -m src.storage_snapshot select release-assets.json)"
            if [ -z "$asset_name" ]; then
              echo "Rolling release latest-db exists but contains no recoverable forecast database asset."
              echo "Restore a verified local database to the release before running the pipeline again."
              exit 1
            fi
            echo "Restoring rolling forecast database from release"
            gh release download latest-db --pattern "$asset_name" --dir .
            python -m src.storage_snapshot verify-asset release-assets.json "$asset_name"
            if [[ "$asset_name" == *.db.zst ]]; then
              gh release download latest-db --pattern "$asset_name.json" --dir .
              python -m src.storage_snapshot verify-asset release-assets.json "$asset_name.json"
              python -m src.storage_snapshot restore "$asset_name" wawp_forecasts.db
            else
              if [ "$asset_name" != "wawp_forecasts.db" ]; then
                mv "$asset_name" wawp_forecasts.db
              fi
              python -c "from pathlib import Path; from src.storage_snapshot import integrity_check; integrity_check(Path('wawp_forecasts.db'))"
            fi
            test -s wawp_forecasts.db
          else
            echo "No rolling database release exists; creating the one-time bootstrap release"
            gh release create latest-db --title "Latest Forecast Database" --notes "Rolling database archive created by the WAWP pipeline."
          fi

      - name: Download AWOS Source Inbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inbox_dir="artifacts/awos-inbox"
          mkdir -p "$inbox_dir"
          if gh release view awos-inbox > /dev/null 2>&1; then
            asset_count="$(gh release view awos-inbox --json assets --jq '[.assets[] | select(.name | endswith(".dat"))] | length')"
            if [ "$asset_count" -gt 0 ]; then
              gh release download awos-inbox --pattern '*.dat' --dir "$inbox_dir" --clobber
              echo "Downloaded $asset_count AWOS source assets."
            else
              echo "AWOS inbox exists but contains no .dat assets."
            fi
          else
            echo "No awos-inbox release exists; continuing without release AWOS ingestion."
          fi

      - name: Ingest AWOS Source Inbox
        run: |
          set -euo pipefail
          inbox_dir="artifacts/awos-inbox"
          if compgen -G "$inbox_dir/*.dat" > /dev/null; then
            python -m src.ingest_awos_inbox \
              --directory "$inbox_dir" \
              --db wawp_forecasts.db \
              --source-tag awos-inbox \
              --report "$inbox_dir/ingestion-report.json"
          else
            echo "No downloaded AWOS assets to ingest."
          fi

      # The compactor never changes the restored release file. It writes a
      # validated candidate first, then the pipeline operates on that candidate.
      # If validation fails, this run stops before it can upload any replacement.
      - name: Compact Rolling Database Before Pipeline
        run: |
          set -euo pipefail
          if [ ! -s wawp_forecasts.db ]; then
            echo "No restored database yet; bootstrap pipeline will create it."
            exit 0
          fi
          candidate_dir="artifacts/operational"
          candidate_db="$candidate_dir/wawp_operational_candidate.db"
          mkdir -p "$candidate_dir"
          python src/build_compact_operational_db.py \
            --source wawp_forecasts.db \
            --output "$candidate_db" \
            --retain-raw-minutes
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/operational/wawp_operational_candidate.db.report.json").read_text())
          if not report.get("valid"):
              raise SystemExit("Compact database candidate did not pass validation")
          print("COMPACTION_VALID=passed")
          print("SOURCE_BYTES=", report["source_size_bytes"])
          print("CANDIDATE_BYTES=", report["candidate_size_bytes"])
          print("RAW_MINUTE_ROWS=", report["raw_minute_source_rows"], "->", report["raw_minute_candidate_rows"])
          PY
          mv -f "$candidate_db" wawp_forecasts.db
          python -c "import sqlite3, sys; db = sqlite3.connect('wawp_forecasts.db'); result = db.execute('PRAGMA integrity_check').fetchone()[0]; db.close(); print('Compact SQLite integrity:', result); sys.exit(0 if result == 'ok' else 1)"

      - name: Run Pipeline
        run: python run_pipeline.py

      - name: Validate Publication Candidate
        run: |
          set -euo pipefail
          python -m src.pipeline_publication_gate \
            --database wawp_forecasts.db \
            --data-dir docs/data \
            --output artifacts/validation/publication_gate.json

      - name: Upload Publication Gate Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-gate-${{ github.run_id }}
          path: artifacts/validation/publication_gate.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Compact Database Audit Report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.compact_db_audit }}
        uses: actions/upload-artifact@v4
        with:
          name: compact-db-audit-${{ github.run_id }}
          path: |
            artifacts/operational/*.report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload AWOS Ingestion Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: awos-ingestion-${{ github.run_id }}
          path: artifacts/awos-inbox/ingestion-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Validate and Upload Database to Release
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s wawp_forecasts.db
          asset_name="wawp_forecasts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.db.zst"
          python -m src.storage_snapshot pack wawp_forecasts.db "$asset_name"
          # GitHub requires every individual release asset to be below 2 GiB.
          test "$(stat -c %s "$asset_name")" -lt 2147483648
          # Commit marker last: an interrupted data upload cannot be selected.
          gh release upload latest-db "$asset_name"
          mkdir -p artifacts/storage-verification
          gh release download latest-db --pattern "$asset_name" --dir artifacts/storage-verification
          cmp "$asset_name" "artifacts/storage-verification/$asset_name"
          gh release upload latest-db "$asset_name.json"
          gh release download latest-db --pattern "$asset_name.json" --dir artifacts/storage-verification
          cmp "$asset_name.json" "artifacts/storage-verification/$asset_name.json"
          # Preserve the existing baseline release assets until independent archive
          # replication and restoration have been demonstrated.

      - name: Commit and Push Dashboard Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/
          git stash push -m "runner-data"
          git pull --rebase origin main
          git stash pop || true
          if [ -n "$(git diff --name-only --diff-filter=U -- docs/data/)" ]; then
            echo "Resolving generated-data conflicts with runner output"
            git checkout --theirs -- docs/data/ || true
            git stash drop || true
          fi
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No generated data changes to commit"
          else
            git commit -m "chore: auto-update dashboard data"
            git push
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy-pages:
    needs: run-pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
