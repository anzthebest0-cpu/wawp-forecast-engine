name: TITAN V3 offline dashboard assembly
on:
  push:
    branches: [codex/titan-spatial-v3]
    paths: ['scripts/build_spatial_review.py','scripts/titan_spatial_review.html','scripts/test_spatial_review.py','.github/workflows/titan_spatial_v3_review.yml']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: titan-v3-pwv
          run-id: '45622818688'
          github-token: ${{ github.token }}
          path: review-inputs/pwv
      - uses: actions/download-artifact@v4
        with:
          name: titan-v3-circulation
          run-id: '45622818688'
          github-token: ${{ github.token }}
          path: review-inputs/circulation
      - uses: actions/download-artifact@v4
        with:
          name: titan-v3-dynamics
          run-id: '45622818688'
          github-token: ${{ github.token }}
          path: review-inputs/dynamics
      - uses: actions/download-artifact@v4
        with:
          name: titan-v3-rain
          run-id: '45622818688'
          github-token: ${{ github.token }}
          path: review-inputs/rain
      - uses: actions/download-artifact@v4
        with:
          name: titan-v3-vertical
          run-id: '45622818688'
          github-token: ${{ github.token }}
          path: review-inputs/vertical
      - uses: actions/download-artifact@v4
        with:
          name: titan-v3-icon
          run-id: '45622818688'
          github-token: ${{ github.token }}
          path: review-inputs/icon
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/build_spatial_review.py scripts/test_spatial_review.py
      - run: python -m pip install pillow playwright
      - run: python -m playwright install chromium
      - run: python scripts/build_spatial_review.py
      - run: python scripts/test_spatial_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: titan-spatial-review-v3-offline
          path: titan-spatial-review/
          retention-days: 7
