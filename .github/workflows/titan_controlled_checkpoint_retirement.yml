name: TITAN one-time approved controlled checkpoint retirement
on:
  push:
    branches: [codex/titan-controlled-checkpoint-retirement]
    paths: ['.github/workflows/titan_controlled_checkpoint_retirement.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: wawp-engine-refs/heads/main
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: titan-checkpoint-recovery-proof
          run-id: '45733820182'
          github-token: ${{ github.token }}
          path: prior-proof
      - uses: actions/download-artifact@v4
        with:
          name: titan-targeted-checkpoint-report
          run-id: '45735965161'
          github-token: ${{ github.token }}
          path: target-proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y rclone zstd
      - run: python -m pip install -r requirements.txt -c requirements-preview-constraints.txt requests
      - run: PYTHONPATH=. python scripts/test_approved_checkpoint_retirement.py
      - name: Verify fresh copies then retire only approved exact asset IDs
        env:
          GH_TOKEN: ${{ github.token }}
          WAWP_RCLONE_CONFIG: ${{ secrets.WAWP_ARCHIVE_RCLONE_CONFIG }}
          WAWP_ARCHIVE_FOLDER_ID: ${{ vars.WAWP_ARCHIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$WAWP_RCLONE_CONFIG" && test -n "$WAWP_ARCHIVE_FOLDER_ID"
          umask 077
          export RCLONE_CONFIG="$RUNNER_TEMP/titan-approved-retirement.conf"
          export RCLONE_CONFIG_WAWP_ROOT_FOLDER_ID="$WAWP_ARCHIVE_FOLDER_ID"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s\n' "$WAWP_RCLONE_CONFIG" > "$RCLONE_CONFIG"
          unset WAWP_RCLONE_CONFIG
          PYTHONPATH=. python scripts/retire_approved_checkpoints.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-controlled-retirement-report
          path: controlled-retirement-report.json
          retention-days: 30
          if-no-files-found: warn
