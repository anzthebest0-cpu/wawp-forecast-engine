name: TITAN one-cycle regional GFS pilot
on:
  push:
    branches: [codex/titan-gfs-regional-pilot]
    paths: ['scripts/pilot_regional_gfs.py', '.github/workflows/titan_gfs_regional_pilot.yml']
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated plotting dependencies
        run: python -m pip install "eccodes>=2.38,<3" "numpy>=2,<3" "matplotlib>=3.9,<4" "basemap>=2,<3"
      - name: Run fixed-cycle experiment
        run: python scripts/pilot_regional_gfs.py --cycle 2026112500 --output regional-pilot
      - uses: actions/upload-artifact@v4
        with:
          name: titan-regional-gfs-2026112500
          path: |
            regional-pilot/*.png
            regional-pilot/manifest.json
          if-no-files-found: error
          retention-days: 7
