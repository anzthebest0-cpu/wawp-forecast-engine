name: TITAN sparse extended horizon numerical pilot
on:
  push:
    branches: [codex/titan-extended-horizon]
permissions:
  contents: read
  actions: read
jobs:
  extended:
    strategy:
      fail-fast: false
      matrix:
        model: [gfs, ifs-025, ifs-010, aifs-025, icon]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: titan-cycle-discovery-report
          run-id: '45652601753'
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "eccodes>=2.42,<3" "numpy>=2,<3" "matplotlib>=3.9,<4" "basemap>=2,<3" "metpy>=1.7,<2" scipy pillow
      - run: python scripts/test_spatial_rain_windows.py
      - run: python scripts/pilot_extended_horizon.py ${{ matrix.model }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-extended-${{ matrix.model }}
          path: |
            extended-horizon-pilot/*.webp
            extended-horizon-pilot/report.json
          retention-days: 7
          if-no-files-found: warn
