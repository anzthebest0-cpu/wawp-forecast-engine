name: TITAN numerical restore proof
on:
  push:
    branches: [main]
    paths: ['.github/workflows/titan_numeric_restore.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [rehearse, remote]
        default: rehearse
      source_run:
        type: string
        default: '45924430403'
      catalog_sha:
        description: Required for remote restore; approved generation catalog SHA256
        type: string
        default: ''
permissions:
  actions: read
  contents: read
concurrency:
  group: titan-private-numerical-archive
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r titan-engine/panel-runtime-lock.txt
          python -m py_compile scripts/titan_numeric_restore.py scripts/titan_numeric_drive.py
      - name: Real source restore rehearsal (no Drive or production writes)
        if: inputs.mode != 'remote'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run || '45924430403' }}
        run: python scripts/titan_numeric_restore.py rehearse "$SOURCE_RUN"
      - name: Verify committed private archive by exact ID
        if: inputs.mode == 'remote'
        env:
          GH_TOKEN: ${{ github.token }}
          WAWP_RCLONE_CONFIG: ${{ secrets.WAWP_ARCHIVE_RCLONE_CONFIG }}
          WAWP_ARCHIVE_FOLDER_ID: ${{ vars.WAWP_ARCHIVE_FOLDER_ID }}
          SOURCE_RUN: ${{ inputs.source_run }}
          CATALOG_SHA: ${{ inputs.catalog_sha }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
          test -n "$WAWP_RCLONE_CONFIG" && test -n "$WAWP_ARCHIVE_FOLDER_ID"
          umask 077
          export RCLONE_CONFIG="$RUNNER_TEMP/titan-restore.conf"
          export RCLONE_CONFIG_WAWP_ROOT_FOLDER_ID="$WAWP_ARCHIVE_FOLDER_ID"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s\n' "$WAWP_RCLONE_CONFIG" > "$RCLONE_CONFIG"
          unset WAWP_RCLONE_CONFIG
          python scripts/titan_numeric_restore.py remote "$SOURCE_RUN" --catalog-sha "$CATALOG_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-numeric-restore-report
          path: titan-restore-report.json
          if-no-files-found: warn
          retention-days: 30
