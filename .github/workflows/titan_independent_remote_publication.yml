name: TITAN independent panel durable Drive publication rehearsal
on:
  push:
    branches: [codex/titan-independent-remote-publication]
permissions:
  contents: read
  actions: read
concurrency:
  group: titan-independent-remote-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: titan-independent-inputs
          path: old-numbers
          run-id: '45759575549'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: titan-full-independent-review-site
          path: old-site
          run-id: '45759575549'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: titan-full-cache-*
          path: new-numbers
          run-id: '45764124872'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: titan-auto-validated-site
          path: new-site
          run-id: '45764124872'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: titan-auto-publication-report
          path: live-proof
          run-id: '45764124872'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ifs010-rh-quarantine-diagnostics
          path: qc-evidence
          run-id: '45758421368'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: titan-panel-runtime-lock
          run-id: '45759575549'
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - run: python -m pip install -r panel-runtime-lock.txt && python -m pip install "requests>=2.32,<3"
      - name: Verify and publish isolated immutable packs
        env:
          WAWP_RCLONE_CONFIG: ${{ secrets.WAWP_ARCHIVE_RCLONE_CONFIG }}
          WAWP_ARCHIVE_FOLDER_ID: ${{ vars.WAWP_ARCHIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$WAWP_RCLONE_CONFIG" && test -n "$WAWP_ARCHIVE_FOLDER_ID"
          umask 077
          export RCLONE_CONFIG="$RUNNER_TEMP/titan-independent.conf"
          export RCLONE_CONFIG_WAWP_ROOT_FOLDER_ID="$WAWP_ARCHIVE_FOLDER_ID"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s\n' "$WAWP_RCLONE_CONFIG" > "$RCLONE_CONFIG"
          unset WAWP_RCLONE_CONFIG
          PYTHONPATH=. python scripts/titan_independent_remote_publication.py publish
      - uses: actions/upload-artifact@v4
        with:
          name: titan-independent-remote-publication-report
          path: remote-publication-report.json
          retention-days: 30
  restore:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: titan-panel-runtime-lock
          run-id: '45759575549'
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - run: python -m pip install -r panel-runtime-lock.txt && python -m pip install "requests>=2.32,<3"
      - name: Restore both verified generations from Drive only
        env:
          WAWP_RCLONE_CONFIG: ${{ secrets.WAWP_ARCHIVE_RCLONE_CONFIG }}
          WAWP_ARCHIVE_FOLDER_ID: ${{ vars.WAWP_ARCHIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$WAWP_RCLONE_CONFIG" && test -n "$WAWP_ARCHIVE_FOLDER_ID"
          umask 077
          export RCLONE_CONFIG="$RUNNER_TEMP/titan-independent.conf"
          export RCLONE_CONFIG_WAWP_ROOT_FOLDER_ID="$WAWP_ARCHIVE_FOLDER_ID"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s\n' "$WAWP_RCLONE_CONFIG" > "$RCLONE_CONFIG"
          unset WAWP_RCLONE_CONFIG
          PYTHONPATH=. python scripts/titan_independent_remote_publication.py restore
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 --directory restored-current-site > /tmp/titan-server.log 2>&1 &
          trap 'kill $!' EXIT
          sleep 2
          node scripts/test_full_panel_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: titan-independent-remote-restore-report
          path: remote-restore-report.json
          retention-days: 30
