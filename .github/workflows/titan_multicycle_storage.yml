name: TITAN localized RH QC and independent model panel experiment
on:
  push:
    branches: [codex/titan-multicycle-storage]
permissions:
  contents: read
  actions: read
concurrency:
  group: titan-multicycle-experiment
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: titan-full-cache-ifs-010
          path: partial
          run-id: '45752072415'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: titan-full-cache-ifs-010
          path: baseline/titan-full-cache-ifs-010
          run-id: '45721468170'
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "eccodes>=2.42,<3" "numpy>=2,<3" "matplotlib>=3.9,<4" "basemap>=2,<3" "metpy>=1.7,<2" scipy pillow
      - run: python scripts/test_spatial_rain_windows.py
      - run: python scripts/test_rh_quarantine_policy.py
      - run: python scripts/recover_ifs010_quarantine.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ifs010-rh-quarantine-diagnostics
          path: ifs-rh-diagnostics/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-ifs-010
          path: |
            regional-cache/manifest.json
            regional-cache/*.npz
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-ifs-010-receipt
          path: reuse-receipt.json
          retention-days: 30
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: titan-full-cache-*
          path: baseline
          run-id: '45721468170'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: titan-full-cache-*
          path: candidate
          run-id: '45752072415'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: recovered-ifs-010
          path: validated-ifs
          run-id: '45757197359'
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "eccodes>=2.42,<3" "numpy>=2,<3" "matplotlib>=3.9,<4" "basemap>=2,<3" "metpy>=1.7,<2" scipy pillow
      - run: |
          set -euo pipefail
          mv candidate/titan-full-cache-ifs-010 rejected-ifs
          mv validated-ifs candidate/titan-full-cache-ifs-010
          python scripts/pilot_independent_panels.py
      - uses: actions/upload-artifact@v4
        with:
          name: titan-independent-panel-benchmark
          path: panel-benchmark/
          retention-days: 30
