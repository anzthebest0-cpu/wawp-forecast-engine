name: TITAN exact IFS 9 km cycle recovery and multi-cycle comparison
on:
  push:
    branches: [codex/titan-multicycle-storage]
permissions:
  contents: read
  actions: read
concurrency:
  group: titan-multicycle-experiment
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: titan-full-cache-ifs-010
          path: partial
          run-id: '45752072415'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: titan-full-cache-ifs-010
          path: baseline/titan-full-cache-ifs-010
          run-id: '45721468170'
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "eccodes>=2.42,<3" "numpy>=2,<3" "matplotlib>=3.9,<4" "basemap>=2,<3" "metpy>=1.7,<2" scipy pillow
      - run: python scripts/test_spatial_rain_windows.py
      - run: python scripts/recover_ifs010_multicycle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ifs010-rh-recovery-diagnostics
          path: ifs-rh-diagnostics/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-ifs-010
          path: |
            regional-cache/manifest.json
            regional-cache/*.npz
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-ifs-010-receipt
          path: reuse-receipt.json
          retention-days: 30
  compare:
    needs: recover
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: titan-full-cache-*
          path: baseline
          run-id: '45721468170'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: titan-full-cache-*
          path: candidate
          run-id: '45752072415'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: reuse-receipt-*
          path: receipts-raw
          run-id: '45752072415'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: recovered-ifs-010
          path: recovered
      - uses: actions/download-artifact@v4
        with:
          name: recovered-ifs-010-receipt
          path: receipts-raw/reuse-receipt-ifs-010
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "eccodes>=2.42,<3" "numpy>=2,<3" "matplotlib>=3.9,<4" "basemap>=2,<3" "metpy>=1.7,<2" scipy pillow
      - run: |
          set -euo pipefail
          mv candidate/titan-full-cache-ifs-010 partial-ifs-010
          mv recovered candidate/titan-full-cache-ifs-010
          mkdir receipts
          for m in gfs ifs-025 ifs-010 aifs-025 icon; do
            mv "receipts-raw/reuse-receipt-$m" "receipts/titan-full-cache-$m"
          done
          python scripts/pilot_multicycle_storage.py compare
      - uses: actions/upload-artifact@v4
        with:
          name: titan-multicycle-storage-report
          path: multicycle-storage-report.json
          retention-days: 30
