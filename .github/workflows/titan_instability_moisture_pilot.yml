name: TITAN instability and moisture zoom pilot
on:
  push:
    branches: [codex/titan-instability-moisture-pilot]
    paths: ['scripts/pilot_instability_moisture.py', '.github/workflows/titan_instability_moisture_pilot.yml']
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "eccodes>=2.42,<3" "numpy>=2,<3" "matplotlib>=3.9,<4" "basemap>=2,<3"
      - name: Syntax preflight
        run: python -m py_compile scripts/pilot_instability_moisture.py scripts/pilot_circulation_comparison.py scripts/pilot_pwv_reflectivity.py scripts/pilot_regional_gfs.py
      - run: python scripts/pilot_instability_moisture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-instability-moisture-three-domains
          path: |
            instability-moisture-pilot/*.png
            instability-moisture-pilot/manifest.json
          retention-days: 7
          if-no-files-found: warn
