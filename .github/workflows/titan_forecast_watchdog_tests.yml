name: TITAN forecast watchdog tests
on:
  push:
    branches: [main]
    paths:
      - 'services/forecast-watchdog/**'
      - '.github/workflows/titan_forecast_watchdog_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: services/forecast-watchdog
  status:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          state=failure
          if [ "$TEST_RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='titan/watchdog-tests' \
            -f description='Mock watchdog tests; no Cloudflare deployment' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
