name: TITAN Dashboard Checks
on:
  push:
    branches:
      - codex/titan-dashboard-phase1
    paths:
      - 'docs/**'
      - 'tests/test_preview_ui.js'
      - 'tests/test_dashboard_browser.cjs'
      - 'tests/test_analysis_workspace.js'
      - 'tests/test_observation_ui.js'
      - 'scripts/probe_awosnet.py'
      - 'tests/test_probe_awosnet.py'
      - 'tests/test_research_ui.js'
      - 'scripts/normalize_awosnet_xml.py'
      - 'tests/test_normalize_awosnet_xml.py'
      - '.github/workflows/titan_dashboard_checks.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/*.js'
      - 'docs/style.css'
      - 'tests/test_preview_ui.js'
      - 'tests/test_dashboard_browser.cjs'
      - 'tests/test_analysis_workspace.js'
      - 'tests/test_observation_ui.js'
      - 'scripts/probe_awosnet.py'
      - 'tests/test_probe_awosnet.py'
      - 'tests/test_research_ui.js'
      - 'scripts/normalize_awosnet_xml.py'
      - 'tests/test_normalize_awosnet_xml.py'
      - '.github/workflows/titan_dashboard_checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check docs/research-ui.js
          node --check docs/observation-ui.js
          node --check docs/analysis-workspace.js
          node --check docs/preview-ui.js
          node --check docs/apexcharts-theme.js
          node --check docs/dashboard.js
      - name: Check preview presentation helpers
        run: |
          node tests/test_preview_ui.js
          node tests/test_analysis_workspace.js
          node tests/test_observation_ui.js
          node tests/test_research_ui.js
      - name: Check offline AWOSnet probe helpers
        run: |
          python -m unittest discover -s tests -p test_probe_awosnet.py
          python -m unittest discover -s tests -p test_normalize_awosnet_xml.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1 apexcharts@3.54.1
          npx playwright install --with-deps chromium
      - name: Run isolated Chromium dashboard smoke tests
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory docs > /tmp/titan-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node tests/test_dashboard_browser.cjs
      - name: Upload browser audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-audit
          path: browser-audit/
          if-no-files-found: warn
          retention-days: 7
