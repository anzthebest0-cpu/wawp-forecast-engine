name: TITAN spatial rainfall and gust pilot
on:
  push:
    branches: [codex/titan-rain-gust-spatial-pilot]
    paths: ['scripts/pilot_rain_gust.py', '.github/workflows/titan_rain_gust_pilot.yml']
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/pilot_rain_gust.py scripts/pilot_pwv_reflectivity.py
      - run: python -m pip install "eccodes>=2.42,<3" "numpy>=2,<3" "matplotlib>=3.9,<4" "basemap>=2,<3"
      - run: python scripts/pilot_rain_gust.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-rain-gust-review
          path: |
            rain-gust-pilot/*.png
            rain-gust-pilot/manifest.json
          retention-days: 7
          if-no-files-found: warn
