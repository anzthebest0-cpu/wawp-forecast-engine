name: TITAN reliability audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/titan_reliability_audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read only deployed public metadata and GitHub run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/titan_reliability_audit.py artifacts/titan-reliability-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: titan-reliability-audit
          path: artifacts/titan-reliability-audit.json
          retention-days: 7
  status:
    if: always()
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Link audit result to commit
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          state=failure
          if [ "$AUDIT_RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context='titan/reliability-audit' \
            -f description='Audit execution only; inspect individual findings' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
