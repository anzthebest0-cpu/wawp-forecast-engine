name: WAWP Bulk Training Archive

on:
  push:
    branches: [main]
    paths: ['.github/workflows/wawp_bulk_training_archive.yml']
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wawp-historical-single-runs
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/bulk-calibration-training-archive' &&
      github.event.label.name == 'bulk-training-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests without credentials or provider requests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone zstd
          python -m pip install -r requirements.txt -c requirements-preview-constraints.txt
          PYTHONPATH=. python -m pytest -q
  recover:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - phase: wet
            start: '2026-04-02'
            end: '2026-06-30'
          - phase: transition
            start: '2026-07-01'
            end: '2026-09-30'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate recovery tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone zstd
          python -m pip install -r requirements.txt -c requirements-preview-constraints.txt
          PYTHONPATH=. python -m pytest -q tests/test_archive_single_runs.py
      - name: Recover common cycles in verified independent archive batches
        env:
          WAWP_RCLONE_CONFIG: ${{ secrets.WAWP_ARCHIVE_RCLONE_CONFIG }}
          WAWP_ARCHIVE_FOLDER_ID: ${{ vars.WAWP_ARCHIVE_FOLDER_ID }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
          PHASE: ${{ matrix.phase }}
        run: |
          set -euo pipefail
          test -n "$WAWP_RCLONE_CONFIG" && test -n "$WAWP_ARCHIVE_FOLDER_ID"
          umask 077
          export RCLONE_CONFIG="$RUNNER_TEMP/wawp-bulk-training.conf"
          export RCLONE_CONFIG_WAWP_ROOT_FOLDER_ID="$WAWP_ARCHIVE_FOLDER_ID"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s\n' "$WAWP_RCLONE_CONFIG" > "$RCLONE_CONFIG"
          unset WAWP_RCLONE_CONFIG
          mkdir -p "$RUNNER_TEMP/bulk-training" artifacts/bulk-training
          rclone about wawp: --json > "$RUNNER_TEMP/bulk-training/quota.json"
          python - "$RUNNER_TEMP/bulk-training/quota.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          if q.get('free') is not None and q['free']<1024**3:
              raise SystemExit('Drive headroom under 1 GiB; archive recovery withheld')
          PY
          PYTHONPATH=. python scripts/recover_forecast_archive.py \
            --start "$START" --end "$END" --gap-start "$START" --common-cycles \
            --work "$RUNNER_TEMP/bulk-training" --remote 'wawp:historical-single-runs' \
            --execution-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PHASE" \
            --report "artifacts/bulk-training/$PHASE.json"
          # Do not start the other phase on a provider throttle or elapsed budget.
          if jq -e '.status | startswith("paused_")' "artifacts/bulk-training/$PHASE.json" >/dev/null; then
            echo 'Verified partial recovery retained; manually retry after cooldown or elapsed-time pause.'
            exit 75
          fi
      - name: Upload phase recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-training-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/bulk-training/*.json
          retention-days: 30
          if-no-files-found: warn
