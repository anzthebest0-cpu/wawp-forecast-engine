name: WAWP Fresh Model Acquisition Rehearsal

on:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

jobs:
  acquisition-shadow:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'model-acquisition-recovery' &&
      github.event.label.name == 'fresh-model-rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and run all regression tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone zstd
          python -m pip install -r requirements.txt -c requirements-preview-constraints.txt
          PYTHONPATH=. python -m pytest -q
      - name: Restore independent copy of production database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/wawp-fresh-model"
          mkdir -p "$work" artifacts/fresh-model
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest-db" --jq .id)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" | jq -s '.' > "$work/release.json"
          asset="$(python -m src.storage_snapshot select "$work/release.json")"
          [[ "$asset" == *.db.zst ]]
          gh release download latest-db --pattern "$asset" --dir "$work"
          gh release download latest-db --pattern "$asset.json" --dir "$work"
          python -m src.storage_snapshot verify-asset "$work/release.json" "$work/$asset"
          python -m src.storage_snapshot verify-asset "$work/release.json" "$work/$asset.json"
          python -m src.storage_snapshot restore "$work/$asset" "$work/source.db"
          sha256sum "$work/source.db" > "$work/source.sha256"
          cp "$work/source.db" "$work/candidate.db"
      - name: Collect provider data, archive raw evidence, and validate preview
        env:
          WAWP_RCLONE_CONFIG: ${{ secrets.WAWP_ARCHIVE_RCLONE_CONFIG }}
          WAWP_ARCHIVE_FOLDER_ID: ${{ vars.WAWP_ARCHIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$WAWP_RCLONE_CONFIG" && test -n "$WAWP_ARCHIVE_FOLDER_ID"
          umask 077
          export RCLONE_CONFIG="$RUNNER_TEMP/wawp-fresh-model.conf"
          export RCLONE_CONFIG_WAWP_ROOT_FOLDER_ID="$WAWP_ARCHIVE_FOLDER_ID"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s\n' "$WAWP_RCLONE_CONFIG" > "$RCLONE_CONFIG"
          unset WAWP_RCLONE_CONFIG
          work="$RUNNER_TEMP/wawp-fresh-model"
          PYTHONPATH=. python scripts/collect_model_preview.py \
            --database "$work/candidate.db" --directory "$work/preview" --work "$work/source-evidence" \
            --remote "wawp:validation/fresh-acquisition/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --report artifacts/fresh-model/acquisition.json --budget-seconds 240
      - name: Verify original data and evaluate acquisition readiness
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/wawp-fresh-model"
          sha256sum -c "$work/source.sha256"
          PYTHONPATH=. python scripts/verify_preview_append.py --baseline "$work/source.db" --candidate "$work/candidate.db" \
            --acquisition-report artifacts/fresh-model/acquisition.json --output artifacts/fresh-model/append-verification.json
          jq -e '.fresh_accepted_models > 0 and .inserted_native_rows > 0 and .preview.status == "model_only"' artifacts/fresh-model/acquisition.json >/dev/null || {
            echo '::error::No newly verified provider data available. Fail-closed preview succeeded, but live acquisition is not ready.'
            exit 1
          }
      - name: Upload metadata and verification report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-model-validation-${{ github.run_id }}
          path: artifacts/fresh-model/*.json
          retention-days: 30
          if-no-files-found: warn
