name: WAWP Prospective Shadow Research

on:
  push:
    branches: [main]
    paths: ['.github/workflows/wawp_shadow_research.yml']
  # Exact 00/12 UTC model cycles, attempted after an eight-hour lag.
  schedule:
    - cron: '20 8,20 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wawp-prospective-shadow-research
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.head.ref == 'codex/prospective-shadow-research' || github.event.pull_request.head.ref == 'codex/diurnal-shadow-candidates' || github.event.pull_request.head.ref == 'codex/hourly-wind-shadow' || github.event.pull_request.head.ref == 'codex/nighttime-spread-shadow' || github.event.pull_request.head.ref == 'codex/adaptive-west-sector-shadow' || github.event.pull_request.head.ref == 'codex/integrated-shadow') &&
      github.event.label.name == 'shadow-research-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests without provider or Drive credentials
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone zstd
          python -m pip install -r requirements.txt -c requirements-preview-constraints.txt
          PYTHONPATH=. python -m pytest -q
  shadow:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shadow tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone zstd
          python -m pip install -r requirements.txt -c requirements-preview-constraints.txt
          PYTHONPATH=. python -m pytest -q tests/test_shadow_research.py
      - name: Capture prospective research and verify previous forecasts
        env:
          WAWP_RCLONE_CONFIG: ${{ secrets.WAWP_ARCHIVE_RCLONE_CONFIG }}
          WAWP_ARCHIVE_FOLDER_ID: ${{ vars.WAWP_ARCHIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$WAWP_RCLONE_CONFIG" && test -n "$WAWP_ARCHIVE_FOLDER_ID"
          umask 077
          export RCLONE_CONFIG="$RUNNER_TEMP/wawp-shadow-research.conf"
          export RCLONE_CONFIG_WAWP_ROOT_FOLDER_ID="$WAWP_ARCHIVE_FOLDER_ID"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s\n' "$WAWP_RCLONE_CONFIG" > "$RCLONE_CONFIG"
          unset WAWP_RCLONE_CONFIG
          mkdir -p "$RUNNER_TEMP/shadow" artifacts/shadow-research
          rclone about wawp: --json > "$RUNNER_TEMP/shadow-quota.json"
          python - "$RUNNER_TEMP/shadow-quota.json" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1]))
          if q.get('free') is not None and q['free']<1024**3:
              raise SystemExit('Drive storage headroom below 1 GiB; shadow research withheld')
          PY
          PYTHONPATH=. python scripts/run_shadow_research.py \
            --work "$RUNNER_TEMP/shadow" --report artifacts/shadow-research/status.json \
            --execution-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload counts-only research status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-research-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/shadow-research/status.json
          retention-days: 30
          if-no-files-found: warn
