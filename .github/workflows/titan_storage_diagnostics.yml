name: TITAN read-only checkpoint diagnostics
on:
  push:
    branches: [codex/titan-storage-diagnostics]
    paths: ['scripts/probe_checkpoint_readback.py','.github/workflows/titan_storage_diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - name: Inspect rolling inventory and compare readback methods
        env:
          WAWP_RCLONE_CONFIG: ${{ secrets.WAWP_ARCHIVE_RCLONE_CONFIG }}
          WAWP_ARCHIVE_FOLDER_ID: ${{ vars.WAWP_ARCHIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$WAWP_RCLONE_CONFIG" && test -n "$WAWP_ARCHIVE_FOLDER_ID"
          umask 077
          export RCLONE_CONFIG="$RUNNER_TEMP/titan-readonly.conf"
          export RCLONE_CONFIG_WAWP_ROOT_FOLDER_ID="$WAWP_ARCHIVE_FOLDER_ID"
          trap 'rm -f "$RCLONE_CONFIG"' EXIT
          printf '%s\n' "$WAWP_RCLONE_CONFIG" > "$RCLONE_CONFIG"
          unset WAWP_RCLONE_CONFIG
          python scripts/probe_checkpoint_readback.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-storage-diagnostic
          path: storage-diagnostic.json
          retention-days: 7
          if-no-files-found: warn
