name = "titan-awos-proxy"
main = "worker.mjs"
compatibility_date = "2026-11-25"
workers_dev = true
preview_urls = false
keep_vars = true

# Activation flags are managed in the Cloudflare runtime dashboard.
# Missing flags fail closed in worker.mjs; do not set them to true in Git.
[vars]
ALLOWED_ORIGIN = "https://anzthebest0-cpu.github.io"

[observability]
enabled = false

# Rolling history database. Collection remains gated by AWOS_HISTORY_ENABLED.
[[d1_databases]]
binding = "AWOS_HISTORY"
database_name = "titan-awos-history"
database_id = "e53299fc-d71d-4730-9529-0b469a2f305f"
migrations_dir = "migrations"

# Cron will be configured after the operator verifies the database schema.
